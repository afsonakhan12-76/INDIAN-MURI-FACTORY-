<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFSONA - Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;
  align-items:center;justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#00c6ff,#7b2ff7,#f107a3);
  padding:20px;
}
.card{
  background:white;width:100%;max-width:390px;
  padding:30px;border-radius:22px;
  box-shadow:0 15px 40px #0003;text-align:center;
}
h2{color:#5422a8}
input{
  width:100%;padding:14px;margin:10px 0;
  border:1px solid #ccc;border-radius:10px;
  font-size:16px;
}
button{
  width:100%;padding:14px;border:0;
  border-radius:10px;color:white;
  background:linear-gradient(90deg,#7b2ff7,#f107a3);
  font-size:16px;font-weight:bold;cursor:pointer;
}
#message{margin-top:15px;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h2>🔐 Reset Password</h2>
  <p>Enter your new Admin password.</p>

  <input id="password" type="password"
    placeholder="New Password" autocomplete="new-password">

  <input id="confirm" type="password"
    placeholder="Confirm Password" autocomplete="new-password">

  <button id="saveBtn" onclick="savePassword()">
    Save New Password
  </button>

  <div id="message"></div>
</div>

<script>
const db = window.supabase.createClient(
  window.SUPABASE_CONFIG.URL,
  window.SUPABASE_CONFIG.KEY
);

async function savePassword(){
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const message = document.getElementById("message");
  const button = document.getElementById("saveBtn");

  if(password.length < 8){
    message.style.color="red";
    message.textContent="Password must be at least 8 characters.";
    return;
  }

  if(password !== confirm){
    message.style.color="red";
    message.textContent="Passwords do not match.";
    return;
  }

  button.disabled=true;
  button.textContent="Please wait...";

  try{
    const {data,error} = await db.auth.getSession();

    if(error || !data.session){
      throw new Error("Reset link is invalid or expired. Request a new password reset email.");
    }

    const {error:updateError} = await db.auth.updateUser({
      password:password
    });

    if(updateError) throw updateError;

    message.style.color="green";
    message.textContent="Password changed successfully! Please login again.";

    await db.auth.signOut();

    setTimeout(()=>{
      window.location.replace("login.html");
    },2000);

  }catch(error){
    message.style.color="red";
    message.textContent=error.message;
    button.disabled=false;
    button.textContent="Save New Password";
  }
}
</script>
</body>
</html>
