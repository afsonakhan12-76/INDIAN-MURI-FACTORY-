
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | INDIAN MURI FACTORY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 font-family:Arial,sans-serif;
 overflow-x:hidden;
 background:#fff;
 position:relative;
}

/* Animated Background */
.background{
 position:fixed;
 inset:0;
 overflow:hidden;
 z-index:-1;
 background:linear-gradient(120deg,
 #ffffff,#effaff,#f0fff4,#fff7ed,#f5f3ff);
 background-size:400% 400%;
 animation:bgColor 14s ease infinite;
}

@keyframes bgColor{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}

.blob{
 position:absolute;
 border-radius:50%;
 filter:blur(5px);
 opacity:.55;
 animation:float 12s ease-in-out infinite alternate;
}

.blob.one{
 width:420px;
 height:420px;
 background:linear-gradient(135deg,#60a5fa,#67e8f9);
 top:-130px;
 left:-130px;
}

.blob.two{
 width:450px;
 height:450px;
 background:linear-gradient(135deg,#86efac,#a7f3d0);
 bottom:-170px;
 right:-130px;
 animation-delay:2s;
}

.blob.three{
 width:300px;
 height:300px;
 background:linear-gradient(135deg,#c4b5fd,#f0abfc);
 top:35%;
 right:5%;
 animation-delay:4s;
}

.blob.four{
 width:280px;
 height:280px;
 background:linear-gradient(135deg,#fed7aa,#fde68a);
 bottom:10%;
 left:5%;
 animation-delay:3s;
}

@keyframes float{
 0%{transform:translate(0,0) scale(1)}
 50%{transform:translate(60px,-50px) scale(1.15)}
 100%{transform:translate(-30px,60px) scale(.95)}
}

/* Login Card */
.login{
 width:100%;
 max-width:430px;
 padding:35px 32px;
 border-radius:25px;
 background:rgba(255,255,255,.86);
 backdrop-filter:blur(22px);
 -webkit-backdrop-filter:blur(22px);
 border:1px solid rgba(255,255,255,.95);
 box-shadow:0 25px 70px rgba(15,23,42,.15);
 animation:cardShow 1s ease;
 position:relative;
}

@keyframes cardShow{
 from{opacity:0;transform:translateY(35px) scale(.96)}
 to{opacity:1;transform:translateY(0) scale(1)}
}

/* Logo */
.logo-box{
 text-align:center;
 margin-bottom:18px;
}

.logo{
 width:120px;
 height:85px;
 object-fit:contain;
 border-radius:15px;
 filter:drop-shadow(0 8px 12px #0002);
}

h2{
 text-align:center;
 color:#123b79;
 font-size:23px;
 font-weight:900;
 margin:8px 0;
 letter-spacing:.5px;
}

.subtitle{
 text-align:center;
 color:#64748b;
 font-size:14px;
 margin-bottom:27px;
}

/* Form */
label{
 display:block;
 margin:18px 0 8px;
 color:#334155;
 font-size:14px;
 font-weight:bold;
}

.input-box{
 position:relative;
}

input{
 width:100%;
 padding:15px;
 border:2px solid #e2e8f0;
 border-radius:12px;
 outline:none;
 font-size:15px;
 background:#fff;
 transition:.3s;
}

input:focus{
 border-color:#0ea5e9;
 box-shadow:0 0 0 4px #0ea5e91c;
}

.password-input{
 padding-right:55px;
}

.eye-btn{
 position:absolute;
 right:5px;
 top:50%;
 transform:translateY(-50%);
 width:43px;
 height:43px;
 border:0;
 background:transparent;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#64748b;
 font-size:21px;
 margin:0;
 padding:0;
}

.eye-btn:hover{
 background:#f1f5f9;
 box-shadow:none;
 transform:translateY(-50%);
}

/* Login Button */
.login-btn{
 width:100%;
 padding:15px;
 margin-top:25px;
 border:0;
 border-radius:12px;
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 background:linear-gradient(100deg,#16a34a,#0891b2,#2563eb);
 background-size:200% 200%;
 transition:.3s;
 box-shadow:0 8px 20px #0891b233;
}

.login-btn:hover{
 background-position:100% 0;
 transform:translateY(-3px);
 box-shadow:0 12px 25px #0891b244;
}

.login-btn:disabled{
 opacity:.6;
 cursor:not-allowed;
 transform:none;
}

/* Forgot Password */
.forgot{
 display:block;
 text-align:center;
 margin-top:20px;
 color:#2563eb;
 font-size:14px;
 font-weight:bold;
 text-decoration:none;
 cursor:pointer;
}

.forgot:hover{text-decoration:underline}

#message{
 text-align:center;
 font-size:14px;
 margin-top:16px;
 overflow-wrap:anywhere;
 color:#dc2626;
}

.success{color:#15803d!important}

.footer{
 text-align:center;
 font-size:12px;
 color:#94a3b8;
 margin-top:27px;
 border-top:1px solid #e2e8f0;
 padding-top:17px;
}

@media(max-width:480px){
 .login{padding:28px 22px}
 h2{font-size:21px}
 .logo{width:110px;height:78px}
 .blob.one,.blob.two{width:280px;height:280px}
}
</style>
</head>

<body>

<div class="background">
 <div class="blob one"></div>
 <div class="blob two"></div>
 <div class="blob three"></div>
 <div class="blob four"></div>
</div>

<div class="login">

 <div class="logo-box">
  <img src="factory-logo.png"
       class="logo"
       alt="Indian Muri Factory Logo">
 </div>

 <h2>INDIAN MURI FACTORY</h2>
 <p class="subtitle">Factory Management System</p>

 <form id="loginForm">

  <label>Email Address</label>
  <input type="email" id="email"
   required autocomplete="username"
   placeholder="Enter admin email">

  <label>Password</label>

  <div class="input-box">
   <input type="password"
    id="password"
    class="password-input"
    required
    autocomplete="current-password"
    placeholder="Enter password">

   <button type="button"
    class="eye-btn"
    id="togglePassword"
    aria-label="Show password"
    aria-pressed="false">
    <svg id="eyeIcon" width="23" height="23"
     viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
     <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
     <circle cx="12" cy="12" r="3"/>
    </svg>
   </button>
  </div>

  <button class="login-btn"
   id="loginBtn" type="submit">
   Login to Dashboard
  </button>

 </form>

 <a class="forgot" id="forgotBtn">
  Forgot Password?
 </a>

 <p id="message"></p>

 <div class="footer">
  🔒 Secure Administrator Access
  <br><br>
  © 2026 INDIAN MURI FACTORY
 </div>

</div>

<script>
const config = window.SUPABASE_CONFIG;
const msg = document.getElementById("message");

if(!config || !config.URL || !config.KEY){
 msg.textContent="Configuration missing. Check config.js";
 throw new Error("Supabase configuration missing");
}

const db=window.supabase.createClient(
 config.URL,config.KEY
);

// Show / Hide Password
const passwordInput=document.getElementById("password");
const togglePassword=document.getElementById("togglePassword");
const eyeIcon=document.getElementById("eyeIcon");

togglePassword.addEventListener("click",()=>{
 const show=passwordInput.type==="password";

 passwordInput.type=show?"text":"password";

 togglePassword.setAttribute("aria-pressed",String(show));
 togglePassword.setAttribute(
  "aria-label",show?"Hide password":"Show password"
 );

 eyeIcon.innerHTML=show
 ? `<path d="M3 3l18 18"/>
    <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
    <path d="M9.9 5.2A10.8 10.8 0 0112 5c6.4 0 10 7 10 7a15 15 0 01-4 4.8"/>
    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"/>`
 : `<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
    <circle cx="12" cy="12" r="3"/>`;
});

// Login
document.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

 e.preventDefault();

 const btn=document.getElementById("loginBtn");

 btn.disabled=true;
 btn.textContent="Please wait...";
 msg.textContent="";
 msg.className="";

 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:document.getElementById("email").value.trim(),
   password:passwordInput.value
  });

  if(error)throw error;
  if(!data.session)throw new Error("Login session not created");

  location.href="index.html";

 }catch(error){
  msg.textContent=error.message;
 }finally{
  btn.disabled=false;
  btn.textContent="Login to Dashboard";
 }
});

// Forgot Password
document.getElementById("forgotBtn")
.addEventListener("click",async()=>{

 const email=document.getElementById("email").value.trim();
 const btn=document.getElementById("forgotBtn");

 msg.className="";
 msg.textContent="";

 if(!email){
  msg.textContent="Please enter your Admin Email Address first.";
  document.getElementById("email").focus();
  return;
 }

 btn.style.pointerEvents="none";
 btn.textContent="Sending...";

 try{
  const resetURL=new URL(
   "reset-password.html",location.href
  ).href;

  const {error}=await db.auth.resetPasswordForEmail(
   email,{redirectTo:resetURL}
  );

  if(error)throw error;

  msg.textContent="Password reset link sent. Check your email.";
  msg.className="success";

 }catch(error){
  msg.textContent=error.message;
 }finally{
  btn.style.pointerEvents="auto";
  btn.textContent="Forgot Password?";
 }
});
</script>

</body>
</html>
