
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">

<title>Admin Login | INDIAN MURI FACTORY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:30px 15px;
 font-family:Arial,sans-serif;
 overflow-x:hidden;
 background:#fff;
}

/* ANIMATED BACKGROUND */

.background{
 position:fixed;
 inset:0;
 z-index:-2;
 background:linear-gradient(
  120deg,
  #ffffff,
  #e0f2fe,
  #dcfce7,
  #fef3c7,
  #ede9fe
 );
 background-size:400% 400%;
 animation:bgMove 14s ease infinite;
}

@keyframes bgMove{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}

.blob{
 position:fixed;
 border-radius:50%;
 filter:blur(5px);
 opacity:.55;
 z-index:-1;
 animation:float 12s ease-in-out infinite alternate;
}

.blob1{
 width:450px;
 height:450px;
 background:linear-gradient(135deg,#38bdf8,#818cf8);
 top:-150px;
 left:-130px;
}

.blob2{
 width:450px;
 height:450px;
 background:linear-gradient(135deg,#4ade80,#a7f3d0);
 bottom:-150px;
 right:-120px;
 animation-delay:3s;
}

.blob3{
 width:300px;
 height:300px;
 background:linear-gradient(135deg,#f9a8d4,#c4b5fd);
 top:30%;
 right:5%;
 animation-delay:5s;
}

.blob4{
 width:300px;
 height:300px;
 background:linear-gradient(135deg,#fde68a,#fb923c);
 bottom:10%;
 left:5%;
 animation-delay:2s;
}

@keyframes float{
 0%{transform:translate(0,0) scale(1)}
 50%{transform:translate(50px,-50px) scale(1.15)}
 100%{transform:translate(-30px,40px) scale(.95)}
}

/* MAIN LOGIN CARD */

.login{
 width:100%;
 max-width:620px;
 padding:35px;
 border-radius:25px;
 background:rgba(255,255,255,.88);
 backdrop-filter:blur(22px);
 -webkit-backdrop-filter:blur(22px);
 border:1px solid rgba(255,255,255,.95);
 box-shadow:0 25px 70px rgba(15,23,42,.16);
 animation:cardShow 1s ease;
}

@keyframes cardShow{
 from{
  opacity:0;
  transform:translateY(35px) scale(.96);
 }
 to{
  opacity:1;
  transform:translateY(0) scale(1);
 }
}

/* LARGE FACTORY LOGO */

.logo-box{
 width:100%;
 margin:0 auto 25px;
 text-align:center;
}

.logo{
 width:100%;
 height:210px;
 object-fit:contain;
 display:block;
 margin:auto;
 border-radius:16px;
 filter:drop-shadow(0 8px 15px #0002);
}

/* TITLE */

h2{
 text-align:center;
 color:#123b79;
 font-size:28px;
 font-weight:900;
 margin:10px 0;
 letter-spacing:1px;
}

.subtitle{
 text-align:center;
 color:#64748b;
 font-size:15px;
 margin-bottom:30px;
}

/* FORM */

label{
 display:block;
 margin:20px 0 9px;
 color:#334155;
 font-size:15px;
 font-weight:bold;
}

input{
 width:100%;
 padding:16px;
 border:2px solid #e2e8f0;
 border-radius:12px;
 outline:none;
 font-size:16px;
 background:white;
 transition:.3s;
}

input:focus{
 border-color:#0ea5e9;
 box-shadow:0 0 0 4px #0ea5e91c;
}

.input-box{
 position:relative;
}

.password-input{
 padding-right:60px;
}

/* EYE BUTTON */

.eye-btn{
 position:absolute;
 right:5px;
 top:50%;
 transform:translateY(-50%);
 width:45px;
 height:45px;
 border:0;
 background:transparent;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#64748b;
 border-radius:9px;
}

.eye-btn:hover{
 background:#f1f5f9;
}

/* LOGIN BUTTON */

.login-btn{
 width:100%;
 padding:17px;
 margin-top:28px;
 border:0;
 border-radius:12px;
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
 background:linear-gradient(
  100deg,
  #16a34a,
  #0891b2,
  #2563eb,
  #7c3aed
 );
 background-size:250% 250%;
 transition:.3s;
 box-shadow:0 8px 22px #0891b244;
}

.login-btn:hover{
 background-position:100% 0;
 transform:translateY(-3px);
 box-shadow:0 12px 25px #0891b255;
}

.login-btn:disabled{
 opacity:.6;
 cursor:not-allowed;
 transform:none;
}

/* FORGOT PASSWORD */

.forgot{
 display:block;
 text-align:center;
 margin-top:22px;
 color:#2563eb;
 font-size:14px;
 font-weight:bold;
 text-decoration:none;
 cursor:pointer;
}

.forgot:hover{
 text-decoration:underline;
}

/* MESSAGE */

#message{
 text-align:center;
 font-size:14px;
 margin-top:17px;
 overflow-wrap:anywhere;
 color:#dc2626;
}

.success{
 color:#15803d!important;
}

/* FOOTER */

.footer{
 text-align:center;
 font-size:12px;
 color:#94a3b8;
 margin-top:28px;
 border-top:1px solid #e2e8f0;
 padding-top:18px;
 line-height:1.8;
}

/* MOBILE RESPONSIVE */

@media(max-width:600px){

 body{
  padding:18px 12px;
 }

 .login{
  padding:25px 20px;
  border-radius:20px;
 }

 .logo{
  height:145px;
 }

 h2{
  font-size:21px;
 }

 .subtitle{
  font-size:13px;
 }

 input{
  padding:14px;
  font-size:15px;
 }

 .login-btn{
  padding:15px;
 }

 .blob1,.blob2{
  width:260px;
  height:260px;
 }
}

@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation:none!important;
  transition:none!important;
 }
}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>

<!-- LOGIN CARD -->

<div class="login">

 <!-- FACTORY LOGO -->

 <div class="logo-box">
  <img
   src="./factory-logo.png"
   class="logo"
   alt="INDIAN MURI FACTORY Logo">
 </div>

 <h2>INDIAN MURI FACTORY</h2>

 <p class="subtitle">
  Factory Management System
 </p>

 <!-- LOGIN FORM -->

 <form id="loginForm">

  <label>Email Address</label>

  <input
   type="email"
   id="email"
   required
   autocomplete="username"
   placeholder="Enter Admin Email">

  <label>Password</label>

  <div class="input-box">

   <input
    type="password"
    id="password"
    class="password-input"
    required
    autocomplete="current-password"
    placeholder="Enter Password">

   <button
    type="button"
    class="eye-btn"
    id="togglePassword"
    aria-label="Show password"
    aria-pressed="false">

    <svg
     id="eyeIcon"
     width="24"
     height="24"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">

     <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
     <circle cx="12" cy="12" r="3"/>

    </svg>

   </button>

  </div>

  <button
   class="login-btn"
   id="loginBtn"
   type="submit">

   Login to Dashboard

  </button>

 </form>

 <a class="forgot" id="forgotBtn">
  Forgot Password?
 </a>

 <p id="message"></p>

 <div class="footer">
  🔒 Secure Administrator Access
  <br>
  INDIAN MURI FACTORY
  <br>
  © 2026 All Rights Reserved
 </div>

</div>

<script>

// SUPABASE CONFIGURATION

const config=window.SUPABASE_CONFIG;

if(!config || !config.URL || !config.KEY){

 document.getElementById("message").textContent=
 "Configuration missing. Please check config.js";

 throw new Error("Supabase configuration missing");
}

const db=window.supabase.createClient(
 config.URL,
 config.KEY
);

const msg=document.getElementById("message");
const passwordInput=document.getElementById("password");

// SHOW / HIDE PASSWORD

const togglePassword=
 document.getElementById("togglePassword");

const eyeIcon=
 document.getElementById("eyeIcon");

togglePassword.addEventListener("click",()=>{

 const show=passwordInput.type==="password";

 passwordInput.type=show?"text":"password";

 togglePassword.setAttribute(
  "aria-pressed",
  String(show)
 );

 togglePassword.setAttribute(
  "aria-label",
  show?"Hide password":"Show password"
 );

 eyeIcon.innerHTML=show
 ? `
 <path d="M3 3l18 18"/>
 <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
 <path d="M9.9 5.2A10.8 10.8 0 0112 5c6.4 0 10 7 10 7a15 15 0 01-4 4.8"/>
 <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"/>
 `
 : `
 <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
 <circle cx="12" cy="12" r="3"/>
 `;

});

// LOGIN

document.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

 e.preventDefault();

 const btn=document.getElementById("loginBtn");

 btn.disabled=true;
 btn.textContent="Please wait...";

 msg.textContent="";
 msg.className="";

 try{

  const {data,error}=await db.auth.signInWithPassword({

   email:document.getElementById("email").value.trim(),

   password:passwordInput.value

  });

  if(error)throw error;

  if(!data.session){
   throw new Error("Login session not created");
  }

  location.href="index.html";

 }catch(error){

  msg.textContent=error.message;

 }finally{

  btn.disabled=false;
  btn.textContent="Login to Dashboard";

 }

});

// FORGOT PASSWORD

document.getElementById("forgotBtn")
.addEventListener("click",async()=>{

 const email=
 document.getElementById("email").value.trim();

 const btn=
 document.getElementById("forgotBtn");

 msg.className="";
 msg.textContent="";

 if(!email){

  msg.textContent=
  "Please enter your Admin Email Address first.";

  document.getElementById("email").focus();

  return;
 }

 btn.style.pointerEvents="none";
 btn.textContent="Sending...";

 try{

  const resetURL=new URL(
   "reset-password.html",
   location.href
  ).href;

  const {error}=await db.auth.resetPasswordForEmail(
   email,
   {redirectTo:resetURL}
  );

  if(error)throw error;

  msg.textContent=
  "Password reset link sent. Please check your email.";

  msg.className="success";

 }catch(error){

  msg.textContent=error.message;

 }finally{

  btn.style.pointerEvents="auto";
  btn.textContent="Forgot Password?";

 }

});

</script>

</body>
</html>
