<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#f1f5f9;font-family:Arial,sans-serif;color:#1e293b}
header{background:#166534;color:white;padding:17px;border-radius:10px;margin-bottom:18px}
.panel{background:white;padding:18px;border-radius:10px;margin-bottom:18px;box-shadow:0 2px 8px #0001}
input{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}
button{border:0;border-radius:7px;padding:11px 16px;background:#15803d;color:white;font-size:15px;cursor:pointer;margin:3px}
.back{background:#475569}
.edit{background:#2563eb}
.delete{background:#dc2626}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:11px;border:1px solid #e2e8f0;text-align:left}
th{background:#dcfce7}
.table-wrap{overflow-x:auto}
#status{margin:12px 0;font-weight:bold}
</style>
</head>
<body>

<header>
<h2>🏭 INDIAN MURI FACTORY</h2>
<p>Supplier Management</p>
<button class="back" onclick="location.href='index.html'">Back to Dashboard</button>
<button class="delete" onclick="logout()">Logout</button>
</header>

<div class="panel">
<h3 id="formTitle">Add New Supplier</h3>

<form id="supplierForm">
<input type="hidden" id="supplierId">

<label>Supplier Name *</label>
<input id="name" required placeholder="Enter supplier name">

<label>Mobile Number</label>
<input id="phone" type="tel" placeholder="Enter mobile number">

<label>Full Address</label>
<input id="address" placeholder="Enter supplier address">

<label>Opening Balance (₹)</label>
<input id="balance" type="number" step="0.01" value="0">

<button type="submit" id="saveBtn">Save Supplier</button>
<button type="button" class="back" onclick="resetForm()">Clear</button>
</form>
<div id="status"></div>
</div>

<div class="panel">
<h3>Supplier List</h3>
<input id="search" placeholder="Search supplier..." oninput="renderSuppliers()">
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Supplier Name</th>
<th>Mobile</th>
<th>Address</th>
<th>Opening Balance</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="supplierRows"></tbody>
</table>
</div>
</div>

<script>
const db=window.supabase.createClient(
  window.SUPABASE_CONFIG.URL,
  window.SUPABASE_CONFIG.KEY
);

let suppliers=[];

document.body.style.display="none";

async function checkLogin(){
  const {data,error}=await db.auth.getSession();
  if(error || !data.session){
    location.replace("login.html");
    return false;
  }
  document.body.style.display="block";
  return true;
}

async function start(){
  if(await checkLogin()) await loadSuppliers();
}
start();

async function logout(){
  await db.auth.signOut();
  location.replace("login.html");
}

function message(text){
  document.getElementById("status").textContent=text;
}

async function loadSuppliers(){
  message("Loading suppliers...");

  const {data,error}=await db
    .from("suppliers")
    .select("id,name,phone,address,opening_balance")
    .order("name");

  if(error){
    message("Error: "+error.message);
    return;
  }

  suppliers=data||[];
  message("Total Suppliers: "+suppliers.length);
  renderSuppliers();
}

function renderSuppliers(){
  const q=document.getElementById("search").value.toLowerCase();
  const tbody=document.getElementById("supplierRows");
  tbody.innerHTML="";

  suppliers.filter(s=>
    [s.name,s.phone,s.address]
    .some(v=>(v||"").toLowerCase().includes(q))
  ).forEach(s=>{
    const tr=document.createElement("tr");

    function cell(value){
      const td=document.createElement("td");
      td.textContent=value??"";
      tr.appendChild(td);
    }

    cell(s.name);
    cell(s.phone);
    cell(s.address);
    cell("₹"+Number(s.opening_balance||0).toFixed(2));

    const td=document.createElement("td");

    const edit=document.createElement("button");
    edit.className="edit";
    edit.textContent="Edit";
    edit.onclick=()=>editSupplier(s.id);

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="Delete";
    del.onclick=()=>deleteSupplier(s.id);

    td.append(edit,del);
    tr.appendChild(td);
    tbody.appendChild(tr);
  });
}

document.getElementById("supplierForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const id=document.getElementById("supplierId").value;

  const supplier={
    name:document.getElementById("name").value.trim(),
    phone:document.getElementById("phone").value.trim(),
    address:document.getElementById("address").value.trim(),
    opening_balance:Number(document.getElementById("balance").value||0)
  };

  if(!supplier.name){
    message("Supplier name is required.");
    return;
  }

  const btn=document.getElementById("saveBtn");
  btn.disabled=true;
  message("Saving...");

  const result=id
    ? await db.from("suppliers").update(supplier).eq("id",id)
    : await db.from("suppliers").insert(supplier);

  btn.disabled=false;

  if(result.error){
    message("Error: "+result.error.message);
    return;
  }

  message(id?"Supplier updated successfully!":"Supplier added successfully!");
  resetForm();
  await loadSuppliers();
});

function editSupplier(id){
  const s=suppliers.find(x=>x.id===id);
  if(!s)return;

  document.getElementById("supplierId").value=s.id;
  document.getElementById("name").value=s.name||"";
  document.getElementById("phone").value=s.phone||"";
  document.getElementById("address").value=s.address||"";
  document.getElementById("balance").value=s.opening_balance||0;

  document.getElementById("formTitle").textContent="Edit Supplier";
  document.getElementById("saveBtn").textContent="Update Supplier";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteSupplier(id){
  if(!confirm("Delete this supplier?"))return;

  const {error}=await db.from("suppliers").delete().eq("id",id);

  if(error){
    message("Error: "+error.message);
    return;
  }

  message("Supplier deleted successfully.");
  await loadSuppliers();
}

function resetForm(){
  document.getElementById("supplierForm").reset();
  document.getElementById("supplierId").value="";
  document.getElementById("balance").value="0";
  document.getElementById("formTitle").textContent="Add New Supplier";
  document.getElementById("saveBtn").textContent="Save Supplier";
}
</script>
</body>
</html>
